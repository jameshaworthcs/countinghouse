# Checks every push to main and every pull request: the full check, the leak guard's patterns
# (CI has no data, so no denylist), and Conventional Commits. Third-party actions are pinned by SHA.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # What this push or pull request adds: from its base, when git has it.
      BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Leak guard (patterns)
        run: |
          node scripts/leak-guard.ts --patterns-only --tree HEAD
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            node scripts/leak-guard.ts --patterns-only --range "$BASE..HEAD"
          fi
      - name: Commit messages
        run: |
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            npx commitlint --from "$BASE" --to HEAD --verbose
          else
            npx commitlint --from "$(git rev-list --max-parents=0 HEAD | tail -n 1)" --to HEAD --verbose
          fi
